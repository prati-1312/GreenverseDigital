[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "./scripts/netlify-publish-guard"

[[redirects]]
  from = "/Testimonials.html"
  to = "/testimonials/"
  status = 301

[[redirects]]
  from = "/blog/blog/is-growing-sustainably-enough.html"
  to = "/blog/is-growing-sustainably-enough/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/Is%20Growing%20Sustainably%20Enough*"
  to = "/blog/is-growing-sustainably-enough/"
  status = 301

[[redirects]]
  from = "/*.html"
  to = "/:splat/"
  status = 301
