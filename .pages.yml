media:
  input: assets/uploads
  output: /assets/uploads
  extensions: [jpg, jpeg, png, webp, avif]
  rename: safe
content:
  - name: articles
    label: Journal articles
    type: collection
    path: src/posts
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    exclude: ["posts.11tydata.js"]
    view:
      fields: [title, publishedOn, published]
      primary: title
      sort: [publishedOn]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: URL slug (do not change after publication)
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Use lowercase words separated by hyphens.
      - name: author
        label: Author
        type: string
        required: true
        default: Pratikshya Sahoo
      - name: publishedOn
        label: Original publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedOn
        label: Last substantive update (optional)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: published
        label: Include in the next approved release
        type: boolean
        default: false
      - name: description
        label: Search description
        type: text
        required: true
      - name: excerpt
        label: Journal card summary
        type: text
        required: true
      - name: seoTitle
        label: Search title override (optional)
        type: string
      - name: hero
        label: Article image
        type: image
        required: true
      - name: heroAlt
        label: Image alternative text
        type: string
        required: true
      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
          rename: safe
